services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: org_ai_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: org_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d org_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

